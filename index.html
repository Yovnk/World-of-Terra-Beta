<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMINA REALMS - CORE SEGURO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:monospace;user-select:none}
body{background:#000;overflow:hidden;touch-action:none}
.screen{position:fixed;inset:0;background:radial-gradient(#1a2a4a,#050810);display:flex;align-items:center;justify-content:center;z-index:200}
.card{background:#111a2e;border:2px solid #33aaff;border-radius:16px;padding:16px;width:96%;max-width:420px;max-height:96vh;overflow:auto}
input{width:100%;padding:10px;margin:4px 0;background:#000;color:#fff;border:1px solid #334;border-radius:8px}
button{width:100%;padding:11px;background:#33aaff;border:none;border-radius:8px;font-weight:bold;margin-top:8px;cursor:pointer;color:#000}
.opt{flex:1;border:1px solid #334;background:#000;padding:8px;border-radius:10px;text-align:center;cursor:pointer;font-size:11px}
.opt.active{border-color:#33aaff;background:#112a4a}
.row{display:flex;gap:6px;margin:4px 0}
.label{font-size:10px;color:#8899aa;margin:8px 0 3px}
.preview{width:100%;background:#000;border:1px solid #334;border-radius:12px;height:120px;display:flex;align-items:center;justify-content:center}
.color{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.color.active{border-color:#fff;box-shadow:0 0 0 2px #3af}
#gameWrap{display:none;position:fixed;inset:0;background:#000}
#game{width:100%;height:100%;image-rendering:pixelated;display:block}
#uiTop{position:fixed;top:0;left:0;right:0;height:54px;background:linear-gradient(#000e,transparent);z-index:10;color:#fff;padding:6px 10px;display:flex;justify-content:space-between;font-size:11px}
.bar{width:100px;height:8px;background:#222;border:1px solid #444;border-radius:4px;overflow:hidden;margin-top:2px}
.fill{height:100%;transition:width 0.2s}
#hotbar{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:10}
.skill{width:46px;height:46px;background:#000d;border:2px solid #3af;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
#joy{position:fixed;bottom:70px;left:12px;width:100px;height:100px;background:rgba(255,255,255,0.07);border-radius:50%;z-index:10;border:1px solid rgba(51,170,255,0.2)}
#stick{position:absolute;width:40px;height:40px;background:#33aaff;border-radius:50%;left:30px;top:30px}
#inv{position:fixed;top:60px;right:8px;width:180px;background:rgba(0,0,0,0.9);border:1px solid #334;border-radius:10px;padding:8px;z-index:10;color:#fff;font-size:10px;display:none}
#invBtn{position:fixed;top:8px;right:8px;z-index:20;background:#000;border:1px solid #3af;color:#fff;padding:6px 10px;border-radius:8px;font-size:11px}
</style>
</head>
<body>
<div id="auth" class="screen"><div class="card"><h2 style="color:#3af;text-align:center">LUMINA REALMS</h2><p style="text-align:center;color:#667;font-size:10px">CORE SEGURO - SIN MAPAS NI MONSTRUOS</p><div id="fReg"><input id="r_user" placeholder="Usuario"><input id="r_pass" type="password" placeholder="Pass"><input id="r_pass2" type="password" placeholder="Repetir"><button onclick="register()">CREAR CUENTA</button><div onclick="showL()" style="text-align:center;color:#8899aa;font-size:11px;margin-top:8px;cursor:pointer">Ya tengo cuenta</div></div><div id="fLog" style="display:none"><input id="l_user" placeholder="Usuario"><input id="l_pass" type="password" placeholder="Pass"><button onclick="login()">ENTRAR</button><div onclick="showR()" style="text-align:center;color:#8899aa;font-size:11px;margin-top:8px;cursor:pointer">Crear cuenta</div></div><div id="msg" style="color:#f66;font-size:11px;text-align:center;margin-top:6px"></div></div></div>
<div id="charCreate" class="screen" style="display:none"><div class="card"><h3 style="color:#3af;text-align:center">CREA TU LEYENDA</h3><div class="preview"><canvas id="charCanvas" width="120" height="120"></canvas></div><input id="c_name" placeholder="Nombre del héroe" maxlength="12"><div class="label">GÉNERO</div><div class="row"><div class="opt active" id="g_m" onclick="setG('m')">♂ Masc</div><div class="opt" id="g_f" onclick="setG('f')">♀ Fem</div><div class="opt" id="g_o" onclick="setG('o')">⚧ Otro</div></div><div class="label">CLASE</div><div class="row"><div class="opt active" id="c_war" onclick="setC('warrior')">⚔️ Guardián</div><div class="opt" id="c_arc" onclick="setC('archer')">🏹 Explorador</div></div><div class="row"><div class="opt" id="c_mag" onclick="setC('mage')">🔮 Hechicero</div><div class="opt" id="c_pri" onclick="setC('priest')">✨ Luminari</div></div><div class="label">CUSTOM</div><div class="row" id="skinC"></div><div class="row" id="hairC"></div><div class="row" id="armorC"></div><button onclick="createChar()">¡COMENZAR AVENTURA!</button></div></div>
<div id="gameWrap"><canvas id="game"></canvas><div id="uiTop"><div><b id="pName"></b> <span id="pClass"></span> Lv<span id="pLv">1</span><br><div class="bar"><div id="hpFill" class="fill" style="background:#f44;width:100%"></div></div><div class="bar"><div id="xpFill" class="fill" style="background:#3af;width:10%"></div></div><span id="mapName">Mundo Seguro</span></div><div style="text-align:right">💰 <span id="goldTxt">0</span><br><span id="posTxt"></span><br><span id="spriteInfo" style="color:#3af">SPRITE OK</span></div></div><div id="invBtn" onclick="toggleInv()">🎒 INV</div><div id="inv"><b>INVENTARIO</b><div id="invList"></div></div><div id="hotbar"><div class="skill" onclick="usePotion()">💊</div><div class="skill" onclick="addRandomItem()">🎁</div><div class="skill" onclick="changeSprite()">👤</div></div><div id="joy"><div id="stick"></div></div></div>
<script>
let curUser=null,gender='m',pClass='warrior',skin='#ffdbac',hair='#3a2a1a',armor='#666';
const skinOpts=['#ffdbac','#f1c27d','#8d5524'],hairOpts=['#3a2a1a','#ffcc00','#ff3333','#33aaff','#fff'],armorOpts=['#666','#2a5a2a','#4a2a7a','#c2b280','#8b0000'];
const classes={warrior:{name:'Guardián',icon:'⚔️',hp:140,atk:16,def:14},archer:{name:'Explorador',icon:'🏹',hp:100,atk:18,def:8},mage:{name:'Hechicero',icon:'🔮',hp:80,atk:24,def:5},priest:{name:'Luminari',icon:'✨',hp:110,atk:12,def:10}};
function setG(g){gender=g;document.querySelectorAll('[id^=g_]').forEach(e=>e.classList.remove('active'));document.getElementById('g_'+g).classList.add('active');drawPreview();}
function setC(c){pClass=c;document.querySelectorAll('[id^=c_]').forEach(e=>e.classList.remove('active'));let m={warrior:'war',archer:'arc',mage:'mag',priest:'pri'};document.getElementById('c_'+m[c]).classList.add('active');armor={warrior:'#666',archer:'#2a5a2a',mage:'#4a2a7a',priest:'#c2b280'}[c];drawPreview();}
function renderC(){let s=document.getElementById('skinC'),h=document.getElementById('hairC'),a=document.getElementById('armorC');s.innerHTML='';h.innerHTML='';a.innerHTML='';skinOpts.forEach(col=>{let d=document.createElement('div');d.className='color'+(col===skin?' active':'');d.style.background=col;d.onclick=()=>{skin=col;renderC();drawPreview();};s.appendChild(d);});hairOpts.forEach(col=>{let d=document.createElement('div');d.className='color'+(col===hair?' active':'');d.style.background=col;d.onclick=()=>{hair=col;renderC();drawPreview();};h.appendChild(d);});armorOpts.forEach(col=>{let d=document.createElement('div');d.className='color'+(col===armor?' active':'');d.style.background=col;d.onclick=()=>{armor=col;renderC();drawPreview();};a.appendChild(d);});}
function drawPreview(){let cv=document.getElementById('charCanvas'),x=cv.getContext('2d');x.clearRect(0,0,120,120);x.fillStyle=armor;x.fillRect(40,50,40,30);x.fillStyle=skin;x.fillRect(44,30,32,18);x.fillStyle=hair;x.fillRect(36,16,48,18);x.fillStyle='#fff';x.font='20px monospace';x.fillText(classes[pClass].icon,80,40);}
function showL(){fReg.style.display='none';fLog.style.display='block';}function showR(){fLog.style.display='none';fReg.style.display='block';}
function register(){let u=r_user.value.trim(),p=r_pass.value,p2=r_pass2.value;if(u.length<3)return msg.innerText='Corto';if(p.length<4)return msg.innerText='Pass corta';if(p!==p2)return msg.innerText='No coincide';let us=JSON.parse(localStorage.getItem('lumina_final')||'{}');if(us[u])return msg.innerText='Ya existe';us[u]={pass:p,char:null};localStorage.setItem('lumina_final',JSON.stringify(us));curUser=u;auth.style.display='none';charCreate.style.display='flex';renderC();drawPreview();}
function login(){let u=l_user.value.trim(),p=l_pass.value;let us=JSON.parse(localStorage.getItem('lumina_final')||'{}');if(!us[u]||us[u].pass!==p)return msg.innerText='Mal';curUser=u;if(us[u].char)enter(us[u].char);else{auth.style.display='none';charCreate.style.display='flex';renderC();drawPreview();}}
function createChar(){let n=c_name.value.trim();if(n.length<2)return;let ch={name:n,gender,pClass,skin,hair,armor,x:15,y:15,lv:1,xp:0,gold:0,hp:classes[pClass].hp,maxHp:classes[pClass].hp,atk:classes[pClass].atk,def:classes[pClass].def,inv:{potion:3}};let us=JSON.parse(localStorage.getItem('lumina_final')||'{}');us[curUser].char=ch;localStorage.setItem('lumina_final',JSON.stringify(us));localStorage.setItem('lumina_cur',curUser);enter(ch);}
function enter(ch){charCreate.style.display='none';auth.style.display='none';gameWrap.style.display='block';pName.innerText=ch.name;pClass.innerText=classes[ch.pClass].icon+' '+classes[ch.pClass].name;startGame(ch);}
function toggleInv(){let i=document.getElementById('inv');i.style.display=i.style.display==='block'?'none':'block';updateInvUI();}

const TILE=32;let tileset={};
function mkTiles(){let mk=(n,fn)=>{let c=document.createElement('canvas');c.width=32;c.height=32;let x=c.getContext('2d');x.imageSmoothingEnabled=false;try{fn(x);}catch(e){x.fillStyle='#f0f';x.fillRect(0,0,32,32);}tileset[n]=c;};
mk('grass',x=>{x.fillStyle='#3a7d2e';x.fillRect(0,0,32,32);x.fillStyle='#4a9d3e';x.fillRect(2,2,4,4);});
mk('tree',x=>{x.fillStyle='#3a7d2e';x.fillRect(0,0,32,32);x.fillStyle='#1a3a0f';x.fillRect(12,16,8,16);x.fillStyle='#1a5a1a';x.beginPath();x.arc(16,10,12,0,Math.PI*2);x.fill();});
mk('wall',x=>{x.fillStyle='#555';x.fillRect(0,0,32,32);x.fillStyle='#777';x.fillRect(2,2,28,28);});
mk('floor',x=>{x.fillStyle='#c2b280';x.fillRect(0,0,32,32);});
}mkTiles();
function getTileImg(id){return tileset[id]||tileset['grass'];}

const ITEMS={
potion:{name:'Poción',icon:'🧪'},coin:{name:'Moneda',icon:'💰'},wood:{name:'Madera',icon:'🪵'},diamond:{name:'Diamante',icon:'💎'},key:{name:'Llave',icon:'🗝️'},
};
function safeAddItem(id,def){if(!id||!def.name||!def.icon)return false;ITEMS[id]=def;return true;}
function getItem(id){return ITEMS[id]||{name:'???',icon:'❓'};}

const MAP_W=60,MAP_H=60;const mapData=[];
(function(){for(let y=0;y<MAP_H;y++){mapData[y]=[];for(let x=0;x<MAP_W;x++){if(x===0||y===0||x===MAP_W-1||y===MAP_H-1)mapData[y][x]='W';else if(Math.random()<0.08)mapData[y][x]='T';else mapData[y][x]='G';}}})();

let SPRITE_URL="./spritesheet.png";
const SPRITES={};
function addSprite(id,url,cols=3,rows=12){
const img=new Image();img.crossOrigin="anonymous";
const e={img,url,cols,rows,loaded:false,fw:0,fh:0};SPRITES[id]=e;
img.onload=()=>{e.loaded=true;e.fw=img.width/cols;e.fh=img.height/rows;document.getElementById('spriteInfo').innerText=`SPRITE ${id} OK`;};
img.src=url;
}
addSprite('main',SPRITE_URL,3,12);
function drawSprite(ctx,id,col,row,dx,dy,dw,dh){const s=SPRITES[id];if(!s||!s.loaded)return false;try{ctx.drawImage(s.img,col*s.fw,row*s.fh,s.fw,s.fh,dx,dy,dw,dh);return true;}catch(e){return false;}}

let player,drops=[],keys={},joyX=0,joyY=0,joyActive=false,anim=0;
function startGame(charData){
let c=document.getElementById('game'),ctx=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight;}resize();addEventListener('resize',resize);
player={...charData,x:charData.x,y:charData.y,dir:0,frame:1,moving:false,sprite:'main',charOffset:0};
drops=[];function addDrop(x,y,id,count=1){if(!ITEMS[id])return false;drops.push({x,y,id,count,icon:ITEMS[id].icon});return true;}
addDrop(18,15,'wood',3);addDrop(20,15,'coin',10);
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if(k==='1')player.charOffset=0;if(k==='2')player.charOffset=4;if(k==='3')player.charOffset=8;});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let joy=document.getElementById('joy'),stick=document.getElementById('stick');
joy.addEventListener('touchstart',()=>joyActive=true);
joy.addEventListener('touchmove',e=>{let r=joy.getBoundingClientRect();let cx=r.left+50,cy=r.top+50;let dx=e.touches[0].clientX-cx,dy=e.touches[0].clientY-cy;let d=Math.hypot(dx,dy);if(d>35){dx=dx/d*35;dy=dy/d*35;}stick.style.left=(30+dx)+'px';stick.style.top=(30+dy)+'px';joyX=dx/35;joyY=dy/35;e.preventDefault();},{passive:false});
joy.addEventListener('touchend',()=>{joyActive=false;joyX=0;joyY=0;stick.style.left='30px';stick.style.top='30px';});
window.usePotion=()=>{if((player.inv.potion||0)>0&&player.hp<player.maxHp){player.inv.potion--;if(player.inv.potion<=0)delete player.inv.potion;player.hp=Math.min(player.maxHp,player.hp+50);updateInvUI();}};
window.addRandomItem=()=>{let ids=Object.keys(ITEMS);let id=ids[Math.floor(Math.random()*ids.length)];drops.push({x:player.x+Math.random()*2,y:player.y+Math.random()*2,id,count:1,icon:ITEMS[id].icon});};
window.changeSprite=()=>{player.charOffset=(player.charOffset+4)%16;};
function getTile(x,y){let ix=Math.floor(x),iy=Math.floor(y);if(iy<0||iy>=MAP_H||ix<0||ix>=MAP_W)return 'W';return mapData[iy][ix];}
function canWalk(x,y){let t=getTile(x,y);return t!=='W'&&t!=='T';}
function checkLevel(){let need=player.lv*50;if(player.xp>=need){player.lv++;player.xp-=need;player.maxHp+=20;player.hp=player.maxHp;}document.getElementById('pLv').innerText=player.lv;document.getElementById('xpFill').style.width=Math.min(100,(player.xp/(player.lv*50))*100)+'%';document.getElementById('hpFill').style.width=(player.hp/player.maxHp*100)+'%';document.getElementById('goldTxt').innerText=player.gold;}
window.updateInvUI=()=>{let list=document.getElementById('invList');list.innerHTML='';let total=0;for(let id in player.inv){let count=player.inv[id];let it=getItem(id);let div=document.createElement('div');div.style.cssText='display:flex;justify-content:space-between;padding:3px;background:#111;margin:2px 0;border-radius:4px;';div.innerHTML=`<span>${it.icon} ${it.name} x${count}</span><span style="color:#3af;cursor:pointer" onclick="Lumina.useItem('${id}')">Usar</span>`;list.appendChild(div);total+=count;}if(total===0)list.innerHTML='<span style="color:#555">Vacío</span>';checkLevel();};
function loop(){
let dx=0,dy=0;if(keys['w']||keys['arrowup'])dy=-1,player.dir=3;if(keys['s']||keys['arrowdown'])dy=1,player.dir=0;if(keys['a']||keys['arrowleft'])dx=-1,player.dir=1;if(keys['d']||keys['arrowright'])dx=1,player.dir=2;if(joyActive){dx+=joyX;dy+=joyY;if(Math.abs(joyX)>Math.abs(joyY))player.dir=joyX>0?2:1;else player.dir=joyY>0?0:3;}
player.moving=dx!==0||dy!==0;if(player.moving)anim+=0.25;
let nx=player.x+dx*0.11,ny=player.y+dy*0.11;if(canWalk(nx,player.y))player.x=nx;if(canWalk(player.x,ny))player.y=ny;
drops=drops.filter(d=>{if(Math.hypot(d.x-player.x,d.y-player.y)<1){if(d.id==='coin')player.gold+=d.count;else player.inv[d.id]=(player.inv[d.id]||0)+d.count;player.xp+=5;updateInvUI();return false;}return true;});
let camX=player.x*TILE-c.width/2+TILE/2,camY=player.y*TILE-c.height/2+TILE/2;
ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);
let sx=Math.floor(camX/TILE)-1,ex=Math.ceil((camX+c.width)/TILE)+1,sy=Math.floor(camY/TILE)-1,ey=Math.ceil((camY+c.height)/TILE)+1;
for(let y=Math.max(0,sy);y<Math.min(MAP_H,ey);y++){for(let x=Math.max(0,sx);x<Math.min(MAP_W,ex);x++){let t=mapData[y][x];let img=getTileImg(t);ctx.drawImage(img,x*TILE-camX,y*TILE-camY,TILE,TILE);}}
drops.forEach(d=>{ctx.font='20px monospace';ctx.fillText(d.icon,d.x*TILE-camX,d.y*TILE-camY);});
let pcx=c.width/2,pcy=c.height/2;let bob=player.moving?Math.sin(anim)*2:0;
let spriteRow=player.charOffset+player.dir;let spriteCol=player.moving?Math.floor(anim)%3:1;
let drawn=drawSprite(ctx,player.sprite,spriteCol,spriteRow,pcx-16,pcy-24+bob,32,48);
if(!drawn){ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(pcx-8,pcy+18,16,4);ctx.fillStyle=player.armor;ctx.fillRect(pcx-10,pcy+2+bob,20,14);ctx.fillStyle=player.skin;ctx.fillRect(pcx-8,pcy-10+bob,16,12);ctx.fillStyle=player.hair;ctx.fillRect(pcx-10,pcy-16+bob,20,8);}
document.getElementById('posTxt').innerText=`${Math.floor(player.x)},${Math.floor(player.y)}`;
requestAnimationFrame(loop);
}
loop();checkLevel();updateInvUI();
window.Lumina={
addItem:safeAddItem,
addSprite:addSprite,
spawn:(id,x,y,c=1)=>{if(!ITEMS[id])return false;drops.push({x:x||player.x+1,y:y||player.y,id,count:c,icon:ITEMS[id].icon});return true;},
setSpriteUrl:(url)=>{SPRITE_URL=url;addSprite('main',url,3,12);},
useItem:(id)=>{if(player.inv[id]){player.inv[id]--;if(player.inv[id]<=0)delete player.inv[id];updateInvUI();}},
list:()=>{console.log('ITEMS:',ITEMS);console.log('SPRITES:',Object.keys(SPRITES));},
player:player
};
}
renderC();drawPreview();
let cur=localStorage.getItem('lumina_cur');if(cur){let us=JSON.parse(localStorage.getItem('lumina_final')||'{}');if(us[cur]&&us[cur].char)enter(us[cur].char);}
</script>
</body>
</html>
