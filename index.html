<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD OF TERRA BETA - NEZHAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:monospace;user-select:none}
body{background:#000;overflow:hidden;touch-action:none}
.screen{position:fixed;inset:0;background:radial-gradient(#1a1a2e,#050508);display:flex;align-items:center;justify-content:center;z-index:200}
.card{background:#0e1322;border:2px solid #ffae33;border-radius:16px;padding:18px;width:96%;max-width:420px;max-height:96vh;overflow:auto}
input{width:100%;padding:11px;margin:5px 0;background:#000;color:#fff;border:1px solid #334;border-radius:8px}
button{width:100%;padding:12px;background:#ffae33;border:none;border-radius:8px;font-weight:bold;margin-top:8px;cursor:pointer;color:#000}
button.secondary{background:#000;border:1px solid #ffae33;color:#ffae33}
.opt{flex:1;border:1px solid #334;background:#000;padding:8px;border-radius:10px;text-align:center;cursor:pointer;font-size:11px;color:#fff}
.opt.active{border-color:#ffae33;background:#2a2010;color:#ffae33}
.row{display:flex;gap:6px;margin:4px 0}
.label{font-size:10px;color:#8899aa;margin:10px 0 4px}
.preview{width:100%;background:#000;border:1px solid #334;border-radius:12px;height:140px;display:flex;align-items:center;justify-content:center}
.slot{background:#000;border:1px dashed #445;padding:10px;border-radius:10px;margin:10px 0;color:#fff;display:flex;gap:10px;align-items:center}
.slot.hasChar{border-style:solid;border-color:#ffae33;background:#1a1508}
#gameWrap{display:none;position:fixed;inset:0;background:#000}
#game{width:100%;height:100%;image-rendering:pixelated;display:block}
#uiTop{position:fixed;top:0;left:0;right:0;height:60px;background:linear-gradient(#000e,transparent);z-index:10;color:#fff;padding:8px 12px;display:flex;justify-content:space-between;font-size:11px}
.bar{width:110px;height:8px;background:#222;border:1px solid #444;border-radius:4px;overflow:hidden;margin-top:3px}
.fill{height:100%;transition:width 0.2s}
#hotbar{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:10}
.skill{width:46px;height:46px;background:#000d;border:2px solid #ffae33;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;cursor:pointer}
#joy{position:fixed;bottom:70px;left:12px;width:100px;height:100px;background:rgba(255,255,255,0.07);border-radius:50%;z-index:10;border:1px solid rgba(255,174,51,0.2)}
#stick{position:absolute;width:40px;height:40px;background:#ffae33;border-radius:50%;left:30px;top:30px}
#inv{position:fixed;top:65px;right:8px;width:200px;background:rgba(0,0,0,0.92);border:1px solid #334;border-radius:10px;padding:8px;z-index:10;color:#fff;font-size:10px;display:none}
#invBtn{position:fixed;top:8px;right:8px;z-index:20;background:#000;border:1px solid #ffae33;color:#fff;padding:6px 12px;border-radius:8px;font-size:11px;cursor:pointer}
#msgBox{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#000e;border:1px solid #ffae33;color:#ffae33;padding:8px 14px;border-radius:8px;z-index:30;display:none;font-size:12px}
</style>
</head>
<body>
<div id="mainMenu" class="screen"><div class="card"><h1 style="color:#ffae33;text-align:center">WORLD OF TERRA</h1><p style="text-align:center;color:#aaa;font-size:11px">BETA - NEZHAL</p><div id="slotArea"></div><div class="preview"><canvas id="menuPreview" width="120" height="120"></canvas></div><button id="btnStart" onclick="startAdventure()">INICIAR PARTIDA</button><button class="secondary" onclick="openCharCreate()">CREAR PERSONAJE</button></div></div>
<div id="charCreate" class="screen" style="display:none"><div class="card"><h3 style="color:#ffae33;text-align:center">CREA TU LEYENDA</h3><div class="preview"><canvas id="charCanvas" width="120" height="120"></canvas></div><input id="c_name" placeholder="Nombre" maxlength="12"><div class="label">GÉNERO</div><div class="row"><div class="opt active" id="g_m" onclick="setG('m')">♂ Hombre</div><div class="opt" id="g_f" onclick="setG('f')">♀ Mujer</div></div><div class="label">CLASE</div><div class="row"><div class="opt active" id="c_war" onclick="setC('warrior')">⚔️ Guardián</div><div class="opt" id="c_arc" onclick="setC('archer')">🏹 Explorador</div></div><div class="row"><div class="opt" id="c_mag" onclick="setC('mage')">🔮 Hechicero</div><div class="opt" id="c_pri" onclick="setC('priest')">✨ Luminari</div></div><button onclick="createChar()">GUARDAR</button><button class="secondary" onclick="closeCharCreate()">VOLVER</button></div></div>
<div id="gameWrap"><canvas id="game"></canvas><div id="uiTop"><div><b id="pName"></b> <span id="pClass"></span> Lv<span id="pLv">1</span><br><div class="bar"><div id="hpFill" class="fill" style="background:#f44;width:100%"></div></div><div class="bar"><div id="xpFill" class="fill" style="background:#ffae33;width:10%"></div></div><span>Nezhal - Ciudad Inicial</span></div><div style="text-align:right">💰 <span id="goldTxt">0</span><br><span id="posTxt"></span><br><span id="spriteInfo" style="color:#ffae33">Cargando...</span></div></div><div id="invBtn" onclick="toggleInv()">🎒 INV</div><div id="inv"><b>INVENTARIO</b><div id="invList"></div><button class="secondary" style="margin-top:8px" onclick="goMenu()">🏠 MENU</button></div><div id="hotbar"><div class="skill" onclick="usePotion()">💊</div><div class="skill" onclick="addRandomItem()">🎁</div><div class="skill" onclick="toggleCollisionDebug()">🧱</div></div><div id="joy"><div id="stick"></div></div><div id="msgBox"></div></div>
<script>
let gender='m',pClass='warrior';
const classes={warrior:{name:'Guardián',icon:'⚔️',hp:140,atk:16,def:14},archer:{name:'Explorador',icon:'🏹',hp:100,atk:18,def:8},mage:{name:'Hechicero',icon:'🔮',hp:80,atk:24,def:5},priest:{name:'Luminari',icon:'✨',hp:110,atk:12,def:10}};
const LS_KEY='world_of_terra_slot';
function getSavedChar(){try{return JSON.parse(localStorage.getItem(LS_KEY))}catch(e){return null}}
function saveChar(ch){localStorage.setItem(LS_KEY,JSON.stringify(ch));}
function setG(g){gender=g;document.getElementById('g_m').classList.toggle('active',g==='m');document.getElementById('g_f').classList.toggle('active',g==='f');drawPreview();}
function setC(c){pClass=c;document.querySelectorAll('[id^=c_]').forEach(e=>e.classList.remove('active'));let m={warrior:'war',archer:'arc',mage:'mag',priest:'pri'};document.getElementById('c_'+m[c]).classList.add('active');drawPreview();}
function drawPreview(){let cv=document.getElementById('charCanvas'),x=cv.getContext('2d');if(!cv)return;x.clearRect(0,0,120,120);let spr=SPRITES[gender==='m'?'man':'women'];if(spr&&spr.loaded){drawSpriteFixed(x,spr,1,0,24,10,72,90);} }
function drawMenuPreview(){let cv=document.getElementById('menuPreview');if(!cv)return;let x=cv.getContext('2d');x.clearRect(0,0,120,120);let ch=getSavedChar();let g=ch?ch.gender:gender;let spr=SPRITES[g==='m'?'man':'women'];if(spr&&spr.loaded){drawSpriteFixed(x,spr,1,0,24,10,72,90);}renderSlot();}}
function renderSlot(){let area=document.getElementById('slotArea');let ch=getSavedChar();if(!ch){area.innerHTML=`<div class="slot"><div>❓</div><div><b>Slot Vacío</b></div></div>`;document.getElementById('btnStart').disabled=true;}else{area.innerHTML=`<div class="slot hasChar"><div>${classes[ch.pClass].icon}</div><div><b>${ch.name}</b> Lv${ch.lv}<br><span style="color:#ffae33">${classes[ch.pClass].name}</span></div></div>`;document.getElementById('btnStart').disabled=false;}}
function openCharCreate(){mainMenu.style.display='none';charCreate.style.display='flex';drawPreview();let ch=getSavedChar();if(ch){c_name.value=ch.name;gender=ch.gender;pClass=ch.pClass;setG(gender);setC(pClass);}}
function closeCharCreate(){charCreate.style.display='none';mainMenu.style.display='flex';drawMenuPreview();}
function createChar(){let n=c_name.value.trim();if(n.length<2){alert('Nombre corto');return;}let exist=getSavedChar();let ch={name:n,gender,pClass,x:22,y:32,lv:exist?exist.lv:1,xp:exist?exist.xp:0,gold:exist?exist.gold:0,hp:classes[pClass].hp,maxHp:classes[pClass].hp,atk:classes[pClass].atk,def:classes[pClass].def,inv:exist?exist.inv:{potion:3}};saveChar(ch);closeCharCreate();}
function startAdventure(){let ch=getSavedChar();if(!ch){openCharCreate();return;}mainMenu.style.display='none';gameWrap.style.display='block';pName.innerText=ch.name;pClass.innerText=classes[ch.pClass].icon;startGame(ch);}
function goMenu(){if(player){saveChar({...player});}gameWrap.style.display='none';mainMenu.style.display='flex';drawMenuPreview();}
function toggleInv(){let i=document.getElementById('inv');i.style.display=i.style.display==='block'?'none':'block';updateInvUI();}
function showMsg(t){let m=document.getElementById('msgBox');m.innerText=t;m.style.display='block';setTimeout(()=>m.style.display='none',2000);}

const TILE=32, MAP_W=80, MAP_H=80;
let nezhalMapImg=new Image(), nezhalMapLoaded=false;
nezhalMapImg.onload=()=>{nezhalMapLoaded=true;buildCollision();};
nezhalMapImg.src='./nezhal.png';
const ITEMS={potion:{name:'Poción',icon:'🧪'},coin:{name:'Moneda',icon:'💰'},wood:{name:'Madera',icon:'🪵'},diamond:{name:'Diamante',icon:'💎'}};
function getItem(id){return ITEMS[id]||{name:'???',icon:'❓'};}
let COLLISION_MAP=[], showCollision=false;
function toggleCollisionDebug(){showCollision=!showCollision;showMsg(showCollision?"Colisiones ON":"OFF");}
function buildCollision(){
for(let y=0;y<MAP_H;y++){COLLISION_MAP[y]=[];for(let x=0;x<MAP_W;x++)COLLISION_MAP[y][x]=0;}
for(let y=0;y<MAP_H;y++){for(let x=0;x<MAP_W;x++){if(x<3 || x>=MAP_W-3 || y<3 || y>=MAP_H-3)COLLISION_MAP[y][x]=1;}}
for(let y=0;y<MAP_H;y++){for(let x=6;x<=10;x++)COLLISION_MAP[y][x]=1;}
for(let x=34;x<=45;x++){for(let y=70;y<MAP_H;y++){COLLISION_MAP[y][x]=0;}}
for(let y=74;y<MAP_H;y++){COLLISION_MAP[y][33]=1;COLLISION_MAP[y][46]=1;}
for(let y=6;y<=20;y++){for(let x=48;x<=77;x++)COLLISION_MAP[y][x]=1;}
for(let y=3;y<=10;y++){for(let x=28;x<=52;x++)COLLISION_MAP[y][x]=1;}
}

// ==== SPRITES FIX JULIE PATITAS DUPLICADAS ====
const SPRITES={};
function addSprite(id,url,cols=4,rows=4){
  const img=new Image();
  const e={img,url,cols,rows,loaded:false,fw:64,fh:64,pad:3};
  SPRITES[id]=e;
  img.onload=()=>{
    e.loaded=true;
    // CORTE CON MARGEN PARA NO VER EL SPRITE DE AL LADO
    let rawW = img.width / cols;
    let rawH = img.height / rows;
    e.fw = Math.floor(rawW - 4); // -4px para no agarrar el vecino
    e.fh = Math.floor(rawH - 2);
    e.rawW = rawW;
    e.rawH = rawH;
    document.getElementById('spriteInfo').innerText=`OK: ${id} ${img.width}x${img.height}`;
    drawPreview();drawMenuPreview();
  };
  img.onerror=()=>{document.getElementById('spriteInfo').innerText=`Falta ${url}`;};
  img.src=url;
}
addSprite('man','./man.png',4,4);
addSprite('women','./women.png',4,4);
addSprite('women_alt','./woman.png',4,4);

function drawSpriteFixed(ctx,spr,col,row,dx,dy,dw,dh){
  if(!spr||!spr.loaded) return false;
  try{
    let sx = col * spr.rawW + 2;
    let sy = row * spr.rawH + 1;
    ctx.drawImage(spr.img, sx, sy, spr.fw, spr.fh, dx, dy, dw, dh);
    return true;
  }catch(e){return false;}
}
function drawSprite(ctx,id,col,row,dx,dy,dw,dh){
  const s=SPRITES[id];
  return drawSpriteFixed(ctx,s,col,row,dx,dy,dw,dh);
}

let player,drops=[],keys={},joyX=0,joyY=0,joyActive=false,anim=0;
function startGame(charData){
let c=document.getElementById('game'),ctx=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight;}resize();addEventListener('resize',resize);
player={...charData,x:charData.x,y:charData.y,dir:0,frame:1,moving:false,sprite:charData.gender==='m'?'man':'women'};
drops=[];drops.push({x:24,y:35,id:'wood',count:3,icon:'🪵'});drops.push({x:24,y:37,id:'coin',count:10,icon:'💰'});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='c')toggleCollisionDebug();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let joy=document.getElementById('joy'),stick=document.getElementById('stick');
joy.addEventListener('touchstart',()=>joyActive=true);
joy.addEventListener('touchmove',e=>{let r=joy.getBoundingClientRect();let cx=r.left+50,cy=r.top+50;let dx=e.touches[0].clientX-cx,dy=e.touches[0].clientY-cy;let d=Math.hypot(dx,dy);if(d>35){dx=dx/d*35;dy=dy/d*35;}stick.style.left=(30+dx)+'px';stick.style.top=(30+dy)+'px';joyX=dx/35;joyY=dy/35;e.preventDefault();},{passive:false});
joy.addEventListener('touchend',()=>{joyActive=false;joyX=0;joyY=0;stick.style.left='30px';stick.style.top='30px';});
window.usePotion=()=>{if((player.inv.potion||0)>0&&player.hp<player.maxHp){player.inv.potion--;if(player.inv.potion<=0)delete player.inv.potion;player.hp=Math.min(player.maxHp,player.hp+50);updateInvUI();}};
window.addRandomItem=()=>{let ids=Object.keys(ITEMS);let id=ids[Math.floor(Math.random()*ids.length)];drops.push({x:player.x+Math.random()*2,y:player.y+Math.random()*2,id,count:1,icon:ITEMS[id].icon});};
function canWalk(x,y){let ix=Math.floor(x),iy=Math.floor(y);if(iy<0||iy>=MAP_H||ix<0||ix>=MAP_W)return false;if(COLLISION_MAP[iy]?.[ix]===1)return false;if(COLLISION_MAP[iy]?.[Math.floor(x+0.4)]===1)return false;if(COLLISION_MAP[iy]?.[Math.floor(x-0.4)]===1)return false;return true;}
function checkExit(){if(player.y>=72 && player.x>=34 && player.x<=45){if(player.y>=75){showMsg("🚪 Puerta cerrada - Beta");player.y=71.5;}}}
function loop(){
let dx=0,dy=0;if(keys['w']||keys['arrowup'])dy=-1,player.dir=3;if(keys['s']||keys['arrowdown'])dy=1,player.dir=0;if(keys['a']||keys['arrowleft'])dx=-1,player.dir=1;if(keys['d']||keys['arrowright'])dx=1,player.dir=2;if(joyActive){dx+=joyX;dy+=joyY;if(Math.abs(joyX)>Math.abs(joyY))player.dir=joyX>0?2:1;else player.dir=joyY>0?0:3;}
player.moving=dx!==0||dy!==0;if(player.moving)anim+=0.22;
let nx=player.x+dx*0.12,ny=player.y+dy*0.12;if(canWalk(nx,player.y))player.x=nx;if(canWalk(player.x,ny))player.y=ny;
checkExit();
drops=drops.filter(d=>{if(Math.hypot(d.x-player.x,d.y-player.y)<1.2){if(d.id==='coin')player.gold+=d.count;else player.inv[d.id]=(player.inv[d.id]||0)+d.count;player.xp+=5;updateInvUI();return false;}return true;});
let camX=player.x*TILE-c.width/2+TILE/2,camY=player.y*TILE-c.height/2+TILE/2;
ctx.fillStyle='#1a2a1a';ctx.fillRect(0,0,c.width,c.height);
if(nezhalMapLoaded){ctx.drawImage(nezhalMapImg,-camX,-camY,MAP_W*TILE,MAP_H*TILE);}
drops.forEach(d=>{ctx.font='22px monospace';ctx.fillText(d.icon,d.x*TILE-camX,d.y*TILE-camY);});
if(showCollision){ctx.fillStyle='rgba(255,0,0,0.45)';for(let y=0;y<MAP_H;y++){for(let x=0;x<MAP_W;x++){if(COLLISION_MAP[y][x]===1){ctx.fillRect(x*TILE-camX,y*TILE-camY,TILE,TILE);}}}}
let pcx=c.width/2,pcy=c.height/2;let bob=player.moving?Math.sin(anim)*3:0;
let col=player.moving?Math.floor(anim)%4:1,row=player.dir;
// DIBUJO FINAL JULIE - CUERPO COMPLETO Y SIN FANTASMA
let drawn=drawSprite(ctx,player.sprite,col,row,pcx-28,pcy-62+bob,56,84);
if(!drawn){drawn=drawSprite(ctx,'women_alt',col,row,pcx-28,pcy-62+bob,56,84);if(!drawn){ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(pcx,pcy+20,12,4,0,0,Math.PI*2);ctx.fill();}}
document.getElementById('posTxt').innerText=`${Math.floor(player.x)},${Math.floor(player.y)}`;
requestAnimationFrame(loop);
}
loop();checkLevel();updateInvUI();
window.Lumina={spawn:(id,x,y,c=1)=>{drops.push({x:x||player.x+1,y:y||player.y,id,count:c,icon:ITEMS[id].icon});return true;}};
function checkLevel(){let need=player.lv*50;if(player.xp>=need){player.lv++;player.xp-=need;player.maxHp+=20;player.hp=player.maxHp;}document.getElementById('pLv').innerText=player.lv;document.getElementById('xpFill').style.width=Math.min(100,(player.xp/(player.lv*50))*100)+'%';document.getElementById('hpFill').style.width=(player.hp/player.maxHp*100)+'%';document.getElementById('goldTxt').innerText=player.gold;}
window.updateInvUI=()=>{let list=document.getElementById('invList');list.innerHTML='';for(let id in player.inv){let count=player.inv[id];let it=getItem(id);let div=document.createElement('div');div.style.cssText='display:flex;justify-content:space-between;padding:3px;background:#111;margin:2px 0;border-radius:4px;';div.innerHTML=`<span>${it.icon} ${it.name} x${count}</span>`;list.appendChild(div);}checkLevel();saveChar({...player});renderSlot();};
}
renderSlot();drawPreview();drawMenuPreview();
</script>
</body>
</html>
