<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD OF TERRA - NEZHAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:monospace;user-select:none}
body{background:#000;overflow:hidden;touch-action:none}
.screen{position:fixed;inset:0;background:radial-gradient(#1a1a2e,#050508);display:flex;align-items:center;justify-content:center;z-index:200}
.card{background:#0e1322;border:2px solid #ffae33;border-radius:16px;padding:18px;width:96%;max-width:420px;max-height:96vh;overflow:auto;box-shadow:0 0 40px #ffae3333}
input{width:100%;padding:11px;margin:5px 0;background:#000;color:#fff;border:1px solid #334;border-radius:8px}
button{width:100%;padding:12px;background:#ffae33;border:none;border-radius:8px;font-weight:bold;margin-top:8px;cursor:pointer;color:#000;letter-spacing:1px}
button.secondary{background:#000;border:1px solid #ffae33;color:#ffae33}
button:disabled{opacity:0.4}
.opt{flex:1;border:1px solid #334;background:#000;padding:8px;border-radius:10px;text-align:center;cursor:pointer;font-size:11px;color:#fff}
.opt.active{border-color:#ffae33;background:#2a2010;color:#ffae33}
.row{display:flex;gap:6px;margin:4px 0}
.label{font-size:10px;color:#8899aa;margin:10px 0 4px;letter-spacing:1px}
.preview{width:100%;background:#000;border:1px solid #334;border-radius:12px;height:140px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.color{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.color.active{border-color:#fff;box-shadow:0 0 0 2px #ffae33}
.slot{background:#000;border:1px dashed #445;padding:10px;border-radius:10px;margin:10px 0;color:#fff;display:flex;gap:10px;align-items:center}
.slot.hasChar{border-style:solid;border-color:#ffae33;background:#1a1508}
.slot .icon{width:56px;height:56px;background:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}
.slot .icon img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
#gameWrap{display:none;position:fixed;inset:0;background:#000}
#game{width:100%;height:100%;image-rendering:pixelated;display:block}
#uiTop{position:fixed;top:0;left:0;right:0;height:60px;background:linear-gradient(#000e,transparent);z-index:10;color:#fff;padding:8px 12px;display:flex;justify-content:space-between;font-size:11px}
.bar{width:110px;height:8px;background:#222;border:1px solid #444;border-radius:4px;overflow:hidden;margin-top:3px}
.fill{height:100%;transition:width 0.2s}
#hotbar{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:10}
.skill{width:46px;height:46px;background:#000d;border:2px solid #ffae33;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;cursor:pointer}
#joy{position:fixed;bottom:70px;left:12px;width:100px;height:100px;background:rgba(255,255,255,0.07);border-radius:50%;z-index:10;border:1px solid rgba(255,174,51,0.2)}
#stick{position:absolute;width:40px;height:40px;background:#ffae33;border-radius:50%;left:30px;top:30px}
#inv{position:fixed;top:65px;right:8px;width:200px;background:rgba(0,0,0,0.92);border:1px solid #334;border-radius:10px;padding:8px;z-index:10;color:#fff;font-size:10px;display:none}
#invBtn{position:fixed;top:8px;right:8px;z-index:20;background:#000;border:1px solid #ffae33;color:#fff;padding:6px 12px;border-radius:8px;font-size:11px;cursor:pointer}
#msgBox{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#000e;border:1px solid #ffae33;color:#ffae33;padding:8px 14px;border-radius:8px;z-index:30;display:none;font-size:12px}
</style>
</head>
<body>

<div id="mainMenu" class="screen">
<div class="card">
<h1 style="color:#ffae33;text-align:center;letter-spacing:3px">WORLD OF TERRA</h1>
<p style="text-align:center;color:#aaa;font-size:11px;margin-bottom:10px">CIUDAD: NEZHAL</p>
<div id="slotArea"></div>
<div class="preview" style="margin:8px 0"><canvas id="menuPreview" width="120" height="120"></canvas></div>
<button id="btnStart" onclick="startAdventure()">INICIAR PARTIDA</button>
<button class="secondary" onclick="openCharCreate()">CREAR / CAMBIAR PERSONAJE</button>
<p style="color:#555;font-size:9px;text-align:center;margin-top:8px">C = ver colisiones</p>
</div>
</div>

<div id="charCreate" class="screen" style="display:none"><div class="card"><h3 style="color:#ffae33;text-align:center">CREA TU LEYENDA</h3>
<div class="preview"><canvas id="charCanvas" width="120" height="120"></canvas></div>
<input id="c_name" placeholder="Nombre del héroe" maxlength="12">
<div class="label">GÉNERO</div>
<div class="row">
<div class="opt active" id="g_m" onclick="setG('m')">♂ Hombre (man.png)</div>
<div class="opt" id="g_f" onclick="setG('f')">♀ Mujer (women.png)</div>
</div>
<div class="label">CLASE</div>
<div class="row"><div class="opt active" id="c_war" onclick="setC('warrior')">⚔️ Guardián</div><div class="opt" id="c_arc" onclick="setC('archer')">🏹 Explorador</div></div>
<div class="row"><div class="opt" id="c_mag" onclick="setC('mage')">🔮 Hechicero</div><div class="opt" id="c_pri" onclick="setC('priest')">✨ Luminari</div></div>
<div class="label">COLORES</div>
<div class="row" id="skinC"></div><div class="row" id="hairC"></div><div class="row" id="armorC"></div>
<button onclick="createChar()">GUARDAR</button>
<button class="secondary" onclick="closeCharCreate()">VOLVER</button>
</div></div>

<div id="gameWrap">
<canvas id="game"></canvas>
<div id="uiTop"><div><b id="pName"></b> <span id="pClass"></span> Lv<span id="pLv">1</span><br><div class="bar"><div id="hpFill" class="fill" style="background:#f44;width:100%"></div></div><div class="bar"><div id="xpFill" class="fill" style="background:#ffae33;width:10%"></div></div><span id="mapName">Nezhal - Ciudad Inicial</span></div><div style="text-align:right">💰 <span id="goldTxt">0</span><br><span id="posTxt"></span><br><span id="spriteInfo" style="color:#ffae33">Cargando...</span></div></div>
<div id="invBtn" onclick="toggleInv()">🎒 INV</div>
<div id="inv"><b>INVENTARIO</b><div id="invList"></div><button class="secondary" style="margin-top:8px" onclick="goMenu()">🏠 MENU</button></div>
<div id="hotbar"><div class="skill" onclick="usePotion()">💊</div><div class="skill" onclick="addRandomItem()">🎁</div><div class="skill" onclick="toggleCollisionDebug()">🧱</div></div>
<div id="joy"><div id="stick"></div></div>
<div id="msgBox"></div>
</div>

<script>
let gender='m',pClass='warrior',skin='#ffdbac',hair='#3a2a1a',armor='#666';
const skinOpts=['#ffdbac','#f1c27d','#8d5524'],hairOpts=['#3a2a1a','#ffcc00','#ff3333','#33aaff','#fff'],armorOpts=['#666','#2a5a2a','#4a2a7a','#c2b280','#8b0000'];
const classes={warrior:{name:'Guardián',icon:'⚔️',hp:140,atk:16,def:14},archer:{name:'Explorador',icon:'🏹',hp:100,atk:18,def:8},mage:{name:'Hechicero',icon:'🔮',hp:80,atk:24,def:5},priest:{name:'Luminari',icon:'✨',hp:110,atk:12,def:10}};
const LS_KEY='world_of_terra_slot';
function getSavedChar(){try{return JSON.parse(localStorage.getItem(LS_KEY))}catch(e){return null}}
function saveChar(ch){localStorage.setItem(LS_KEY,JSON.stringify(ch));}
function setG(g){gender=g;document.getElementById('g_m').classList.toggle('active',g==='m');document.getElementById('g_f').classList.toggle('active',g==='f');drawPreview();drawMenuPreview();}
function setC(c){pClass=c;document.querySelectorAll('[id^=c_]').forEach(e=>e.classList.remove('active'));let m={warrior:'war',archer:'arc',mage:'mag',priest:'pri'};document.getElementById('c_'+m[c]).classList.add('active');drawPreview();drawMenuPreview();}
function renderC(){let s=document.getElementById('skinC'),h=document.getElementById('hairC'),a=document.getElementById('armorC');s.innerHTML='';h.innerHTML='';a.innerHTML='';skinOpts.forEach(col=>{let d=document.createElement('div');d.className='color'+(col===skin?' active':'');d.style.background=col;d.onclick=()=>{skin=col;renderC();drawPreview();};s.appendChild(d);});hairOpts.forEach(col=>{let d=document.createElement('div');d.className='color'+(col===hair?' active':'');d.style.background=col;d.onclick=()=>{hair=col;renderC();drawPreview();};h.appendChild(d);});armorOpts.forEach(col=>{let d=document.createElement('div');d.className='color'+(col===armor?' active':'');d.style.background=col;d.onclick=()=>{armor=col;renderC();drawPreview();};a.appendChild(d);});}
function drawPreview(){let cv=document.getElementById('charCanvas'),x=cv.getContext('2d');x.clearRect(0,0,120,120);let spr=SPRITES[gender==='m'?'man':'women'];if(spr&&spr.loaded){x.drawImage(spr.img,spr.fw*1,0,spr.fw,spr.fh,24,8,72,100);}else{x.fillStyle=armor;x.fillRect(40,50,40,30);x.fillStyle=skin;x.fillRect(44,30,32,18);x.fillStyle=hair;x.fillRect(36,16,48,18);x.fillStyle='#fff';x.font='20px monospace';x.fillText(classes[pClass].icon,80,40);}}
function drawMenuPreview(){let cv=document.getElementById('menuPreview');if(!cv)return;let x=cv.getContext('2d');x.clearRect(0,0,120,120);let ch=getSavedChar();let g=ch?ch.gender:gender;let spr=SPRITES[g==='m'?'man':'women'];if(spr&&spr.loaded){x.drawImage(spr.img,spr.fw*1,0,spr.fw,spr.fh,24,8,72,100);}else{x.fillStyle='#fff';x.font='11px monospace';x.fillText(ch?ch.name:'Sin personaje',10,60);}renderSlot();}
function renderSlot(){let area=document.getElementById('slotArea');let ch=getSavedChar();if(!ch){area.innerHTML=`<div class="slot"><div class="icon">❓</div><div><b>Slot Vacío</b><br><span style="color:#667;font-size:10px">Crea tu héroe para Nezhal</span></div></div>`;document.getElementById('btnStart').disabled=true;document.getElementById('btnStart').innerText='CREA UN PERSONAJE PRIMERO';}else{let iconTxt=classes[ch.pClass].icon;area.innerHTML=`<div class="slot hasChar"><div class="icon">${iconTxt}</div><div><b>${ch.name}</b> Lv${ch.lv}<br><span style="color:#ffae33">${classes[ch.pClass].name} - ${ch.gender==='m'?'Hombre':'Mujer'}</span><br><span style="color:#667">${ch.gold} oro</span></div></div>`;document.getElementById('btnStart').disabled=false;document.getElementById('btnStart').innerText='INICIAR EN NEZHAL';}}
function openCharCreate(){mainMenu.style.display='none';charCreate.style.display='flex';renderC();drawPreview();let ch=getSavedChar();if(ch){c_name.value=ch.name;gender=ch.gender;pClass=ch.pClass;skin=ch.skin;hair=ch.hair;armor=ch.armor;setG(gender);setC(pClass);}}
function closeCharCreate(){charCreate.style.display='none';mainMenu.style.display='flex';drawMenuPreview();}
function createChar(){let n=c_name.value.trim();if(n.length<2){alert('Nombre muy corto');return;}let exist=getSavedChar();let ch={name:n,gender,pClass,skin,hair,armor,x:30,y:32,lv:exist?exist.lv:1,xp:exist?exist.xp:0,gold:exist?exist.gold:0,hp:classes[pClass].hp,maxHp:classes[pClass].hp,atk:classes[pClass].atk,def:classes[pClass].def,inv:exist?exist.inv:{potion:3}};saveChar(ch);closeCharCreate();}
function startAdventure(){let ch=getSavedChar();if(!ch){openCharCreate();return;}mainMenu.style.display='none';charCreate.style.display='none';gameWrap.style.display='block';pName.innerText=ch.name;pClass.innerText=classes[ch.pClass].icon+' '+classes[ch.pClass].name;startGame(ch);}
function goMenu(){if(player){let toSave={...player,x:player.x,y:player.y};saveChar(toSave);}gameWrap.style.display='none';mainMenu.style.display='flex';drawMenuPreview();}
function toggleInv(){let i=document.getElementById('inv');i.style.display=i.style.display==='block'?'none':'block';updateInvUI();}
function showMsg(t){let m=document.getElementById('msgBox');m.innerText=t;m.style.display='block';setTimeout(()=>m.style.display='none',2000);}

// MAPA Y COLISIONES NEZHAL
const TILE=32; const MAP_W=60, MAP_H=60;
let nezhalMapImg=new Image(); let nezhalMapLoaded=false;
nezhalMapImg.onload=()=>{nezhalMapLoaded=true;};
nezhalMapImg.src='./nezhal.png';
let altNezhal=new Image(); altNezhal.onload=()=>{ if(!nezhalMapLoaded){ nezhalMapImg=altNezhal; nezhalMapLoaded=true; } };
altNezhal.src='./assets/maps/nezhal.png';
altNezhal.src='./nerzhal.png';

const ITEMS={potion:{name:'Poción',icon:'🧪'},coin:{name:'Moneda',icon:'💰'},wood:{name:'Madera',icon:'🪵'},diamond:{name:'Diamante',icon:'💎'},key:{name:'Llave',icon:'🗝️'}};
function getItem(id){return ITEMS[id]||{name:'???',icon:'❓'};}

// ---- COLISIONES EXACTAS DE TU IMAGEN ----
const COLLISION_MAP=[];
function buildCollision(){
 for(let y=0;y<MAP_H;y++){COLLISION_MAP[y]=[];for(let x=0;x<MAP_W;x++) COLLISION_MAP[y][x]=0;}
 // 1. Muralla exterior completa (grosor 5)
 for(let y=0;y<MAP_H;y++){ for(let x=0;x<MAP_W;x++){ if(x<5 || x>=MAP_W-5 || y<5 || y>=MAP_H-5) COLLISION_MAP[y][x]=1; }}
 // Abrir huecos de puertas pero los controlamos aparte
 // Puerta SUR NERZHAL - en tu imagen abajo centro
 for(let x=27;x<=33;x++){ for(let y=54;y<MAP_H;y++){ COLLISION_MAP[y][x]=0; } }
 // Puerta NORTE Castillo - bloqueada por ahora (solo visual)
 for(let x=27;x<=33;x++){ for(let y=0;y<9;y++){ COLLISION_MAP[y][x]=1; } }
 COLLISION_MAP[8][29]=1; COLLISION_MAP[8][30]=1; COLLISION_MAP[8][31]=1; // portón castillo cerrado
 // Lateral izquierdo roto - lo bloqueamos porque dijiste solo puerta principal
 COLLISION_MAP[28][0]=1; COLLISION_MAP[28][1]=1; COLLISION_MAP[28][2]=1; COLLISION_MAP[28][3]=1; COLLISION_MAP[28][4]=1;
 COLLISION_MAP[29][0]=1; COLLISION_MAP[29][1]=1; COLLISION_MAP[29][2]=1; COLLISION_MAP[29][3]=1; COLLISION_MAP[29][4]=1;

 // 2. Casa ROJA arriba izq
 for(let y=12;y<=22;y++){ for(let x=9;x<=22;x++){ COLLISION_MAP[y][x]=1; }}
 // 3. Casa AZUL arriba der
 for(let y=15;y<=25;y++){ for(let x=38;x<=51;x++){ COLLISION_MAP[y][x]=1; }}
 // 4. Casa VERDE abajo izq
 for(let y=35;y<=43;y++){ for(let x=10;x<=20;x++){ COLLISION_MAP[y][x]=1; }}
 // 5. Casa AMARILLA abajo der
 for(let y=36;y<=45;y++){ for(let x=37;x<=50;x++){ COLLISION_MAP[y][x]=1; }}
 // 6. Castillo norte
 for(let y=5;y<=10;y++){ for(let x=20;x<=40;x++){ COLLISION_MAP[y][x]=1; }}
 // 7. Pozo y rocas (obstáculos pequeños)
 COLLISION_MAP[40][7]=1; COLLISION_MAP[40][8]=1; COLLISION_MAP[33][7]=1;
}
buildCollision();

let showCollision=false;
function toggleCollisionDebug(){ showCollision=!showCollision; showMsg(showCollision?"Colisiones visibles":"Colisiones ocultas"); }

const SPRITES={};
function addSprite(id,url,cols=4,rows=4){
 const img=new Image(); img.crossOrigin="anonymous";
 const e={img,url,cols,rows,loaded:false,fw:64,fh:64}; SPRITES[id]=e;
 img.onload=()=>{e.loaded=true;e.fw=img.width/cols;e.fh=img.height/rows;document.getElementById('spriteInfo').innerText=`OK: ${id} ${img.width}x${img.height}`;drawPreview();drawMenuPreview();};
 img.onerror=()=>{document.getElementById('spriteInfo').innerText=`Falta ${url}`;};
 img.src=url;
}
addSprite('man','./man.png',4,4);
addSprite('man_alt','./assets/characters/man.png',4,4);
addSprite('man_alt2','./male.png',4,4);
addSprite('women','./women.png',4,4);
addSprite('women_alt','./assets/characters/women.png',4,4);
addSprite('women_alt2','./woman.png',4,4);

function drawSprite(ctx,id,col,row,dx,dy,dw,dh){const s=SPRITES[id];if(!s||!s.loaded)return false;try{ctx.drawImage(s.img,col*s.fw,row*s.fh,s.fw,s.fh,dx,dy,dw,dh);return true;}catch(e){return false;}}

let player,drops=[],keys={},joyX=0,joyY=0,joyActive=false,anim=0;
function startGame(charData){
 let c=document.getElementById('game'),ctx=c.getContext('2d');
 function resize(){c.width=innerWidth;c.height=innerHeight;}resize();addEventListener('resize',resize);
 player={...charData,x:charData.x,y:charData.y,dir:0,frame:1,moving:false,sprite:charData.gender==='m'?'man':'women'};
 drops=[];function addDrop(x,y,id,count=1){if(!ITEMS[id])return false;drops.push({x,y,id,count,icon:ITEMS[id].icon});return true;}
 addDrop(30,35,'wood',3);addDrop(30,38,'coin',10);
 addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if(k==='c')toggleCollisionDebug();});
 addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
 let joy=document.getElementById('joy'),stick=document.getElementById('stick');
 joy.addEventListener('touchstart',()=>joyActive=true);
 joy.addEventListener('touchmove',e=>{let r=joy.getBoundingClientRect();let cx=r.left+50,cy=r.top+50;let dx=e.touches[0].clientX-cx,dy=e.touches[0].clientY-cy;let d=Math.hypot(dx,dy);if(d>35){dx=dx/d*35;dy=dy/d*35;}stick.style.left=(30+dx)+'px';stick.style.top=(30+dy)+'px';joyX=dx/35;joyY=dy/35;e.preventDefault();},{passive:false});
 joy.addEventListener('touchend',()=>{joyActive=false;joyX=0;joyY=0;stick.style.left='30px';stick.style.top='30px';});
 window.usePotion=()=>{if((player.inv.potion||0)>0&&player.hp<player.maxHp){player.inv.potion--;if(player.inv.potion<=0)delete player.inv.potion;player.hp=Math.min(player.maxHp,player.hp+50);updateInvUI();}};
 window.addRandomItem=()=>{let ids=Object.keys(ITEMS);let id=ids[Math.floor(Math.random()*ids.length)];drops.push({x:player.x+Math.random()*2,y:player.y+Math.random()*2,id,count:1,icon:ITEMS[id].icon});};
 function getTileIndex(x,y){return COLLISION_MAP[Math.floor(y)]?.[Math.floor(x)] ?? 1;}
 function canWalk(x,y){
   let ix=Math.floor(x), iy=Math.floor(y);
   if(iy<0||iy>=MAP_H||ix<0||ix>=MAP_W) return false;
   if(COLLISION_MAP[iy][ix]===1) return false;
   // Bloquear un poco mas el cuerpo (32px)
   if(COLLISION_MAP[iy][Math.floor(x+0.6)]===1) return false;
   if(COLLISION_MAP[iy][Math.floor(x-0.6)]===1) return false;
   return true;
 }
 function checkLevel(){let need=player.lv*50;if(player.xp>=need){player.lv++;player.xp-=need;player.maxHp+=20;player.hp=player.maxHp;}document.getElementById('pLv').innerText=player.lv;document.getElementById('xpFill').style.width=Math.min(100,(player.xp/(player.lv*50))*100)+'%';document.getElementById('hpFill').style.width=(player.hp/player.maxHp*100)+'%';document.getElementById('goldTxt').innerText=player.gold;}
 window.updateInvUI=()=>{let list=document.getElementById('invList');list.innerHTML='';let total=0;for(let id in player.inv){let count=player.inv[id];let it=getItem(id);let div=document.createElement('div');div.style.cssText='display:flex;justify-content:space-between;padding:3px;background:#111;margin:2px 0;border-radius:4px;';div.innerHTML=`<span>${it.icon} ${it.name} x${count}</span><span style="color:#ffae33;cursor:pointer" onclick="Lumina.useItem('${id}')">Usar</span>`;list.appendChild(div);total+=count;}if(total===0)list.innerHTML='<span style="color:#555">Vacío</span>';checkLevel();saveChar({...player});renderSlot();};
 function checkExit(){
   // Si toca la puerta sur NERZHAL
   if(player.y>=54 && player.x>=27 && player.x<=33){
     if(player.y>=56){ showMsg("🚪 Puerta de Nezhal cerrada - Aún no puedes salir"); player.y=53.5; }
   }
 }
 function loop(){
   let dx=0,dy=0;if(keys['w']||keys['arrowup'])dy=-1,player.dir=3;if(keys['s']||keys['arrowdown'])dy=1,player.dir=0;if(keys['a']||keys['arrowleft'])dx=-1,player.dir=1;if(keys['d']||keys['arrowright'])dx=1,player.dir=2;if(joyActive){dx+=joyX;dy+=joyY;if(Math.abs(joyX)>Math.abs(joyY))player.dir=joyX>0?2:1;else player.dir=joyY>0?0:3;}
   player.moving=dx!==0||dy!==0;if(player.moving)anim+=0.25;
   let nx=player.x+dx*0.11,ny=player.y+dy*0.11;if(canWalk(nx,player.y))player.x=nx;if(canWalk(player.x,ny))player.y=ny;
   checkExit();
   drops=drops.filter(d=>{if(Math.hypot(d.x-player.x,d.y-player.y)<1){if(d.id==='coin')player.gold+=d.count;else player.inv[d.id]=(player.inv[d.id]||0)+d.count;player.xp+=5;updateInvUI();return false;}return true;});
   let camX=player.x*TILE-c.width/2+TILE/2,camY=player.y*TILE-c.height/2+TILE/2;
   ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);
   if(nezhalMapLoaded){ ctx.drawImage(nezhalMapImg, -camX, -camY, MAP_W*TILE, MAP_H*TILE); }
   drops.forEach(d=>{ctx.font='20px monospace';ctx.fillText(d.icon,d.x*TILE-camX,d.y*TILE-camY);});
   // debug colisiones
   if(showCollision){ ctx.fillStyle='rgba(255,0,0,0.35)'; for(let y=0;y<MAP_H;y++){ for(let x=0;x<MAP_W;x++){ if(COLLISION_MAP[y][x]===1){ ctx.fillRect(x*TILE-camX,y*TILE-camY,TILE,TILE); } } } }
   let pcx=c.width/2,pcy=c.height/2;let bob=player.moving?Math.sin(anim)*2:0;
   let spriteRow=player.dir; let spriteCol=player.moving?Math.floor(anim)%4:1;
   let drawn=drawSprite(ctx,player.sprite,spriteCol,spriteRow,pcx-20,pcy-28+bob,40,56);
   if(!drawn){ let altId=player.sprite==='man'?'man_alt':'women_alt'; drawn=drawSprite(ctx,altId,spriteCol,spriteRow,pcx-20,pcy-28+bob,40,56); if(!drawn){ let alt2=player.sprite==='man'?'man_alt2':'women_alt2'; drawn=drawSprite(ctx,alt2,spriteCol,spriteRow,pcx-20,pcy-28+bob,40,56); if(!drawn){ ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(pcx-8,pcy+18,16,4);ctx.fillStyle=player.armor;ctx.fillRect(pcx-10,pcy+2+bob,20,14);ctx.fillStyle=player.skin;ctx.fillRect(pcx-8,pcy-10+bob,16,12);ctx.fillStyle=player.hair;ctx.fillRect(pcx-10,pcy-16+bob,20,8); } } }
   document.getElementById('posTxt').innerText=`${Math.floor(player.x)},${Math.floor(player.y)}`;
   requestAnimationFrame(loop);
 }

 window.Lumina={ spawn:(id,x,y,c=1)=>{if(!ITEMS[id])return false;drops.push({x:x||player.x+1,y:y||player.y,id,count:c,icon:ITEMS[id].icon});return true;}, useItem:(id)=>{if(player.inv[id]){player.inv[id]--;if(player.inv[id]<=0)delete player.inv[id];updateInvUI();}}, player:player };
